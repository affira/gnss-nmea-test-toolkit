[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gnsskit"
version = "0.1.0"
description = "Parse, integrity-check and analyse recorded NMEA 0183 logs from GNSS receivers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"  # code; data/real/ logs are BSD-2-Clause (data/real/GPSD-COPYING)
license-files = ["LICENSE"]
dependencies = [
    "pyyaml>=6",  # test profile files (yaml.safe_load only)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "robotframework>=7",
]

[project.scripts]
gnsskit = "gnsskit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra --strict-markers"
